<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel | Command Service</title>
    <link rel="icon" type="image/png" href="assets/img/isotipo-dark.png">
    <meta name="theme-color" content="#09090b">
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="app-body">
    <!-- Mientras se valida la sesión -->
    <div class="boot" id="boot">
        <img src="assets/img/logo-dark.png" alt="Command Service" class="only-dark">
        <img src="assets/img/logo-light.png" alt="Command Service" class="only-light">
        <div class="loader"></div>
    </div>

    <div class="layout" id="layout" hidden>
        <!-- Menú lateral (se arma según el rol en js/app/main.js) -->
        <aside class="sidebar" id="sidebar" aria-label="Menú principal">
            <a href="#/inicio" class="sidebar-logo">
                <img src="assets/img/logo-dark.png" alt="Command Service" class="only-dark">
                <img src="assets/img/logo-light.png" alt="Command Service" class="only-light">
            </a>
            <nav id="nav"></nav>
            <div class="sidebar-user">
                <span class="avatar" id="userAvatar"></span>
                <div class="info">
                    <strong id="userName"></strong>
                    <span class="subtle" id="userRole"></span>
                </div>
                <button class="icon-btn" id="logoutBtn" title="Cerrar sesión" aria-label="Cerrar sesión"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <div class="main">
            <header class="topbar">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú"><i class="fas fa-bars"></i></button>
                <div>
                    <div class="crumb" id="crumb">Command Service</div>
                    <h1 id="pageTitle">Inicio</h1>
                </div>
                <div class="topbar-actions">
                    <span class="role-chip" id="roleChip"></span>
                    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Cambiar tema" title="Cambiar tema claro / oscuro"><i class="fas fa-sun"></i><i class="fas fa-moon"></i></button>
                    <a href="/" class="icon-btn" title="Ir a la página principal" aria-label="Ir a la página principal"><i class="fas fa-house"></i></a>
                </div>
            </header>
            <main class="content" id="view" tabindex="-1"></main>
        </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="assets/js/app/main.js"></script>
</body>
</html>

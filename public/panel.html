<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi panel | Command Service</title>
    <link rel="icon" type="image/png" href="LOGO CUADRADO.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="landstyle.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Página protegida de ejemplo: solo se muestra si hay sesión válida.
         Aquí construirás luego el dashboard de cliente / proveedor. -->
    <main class="panel-page">
        <div class="panel-card" id="panel" hidden>
            <div class="avatar" id="avatar"></div>
            <h1 id="saludo"></h1>
            <span class="badge" id="rolBadge"></span>
            <dl>
                <dt>Correo</dt><dd id="email"></dd>
                <dt>ID de usuario</dt><dd id="userId"></dd>
            </dl>
            <div class="panel-actions">
                <a href="/" class="btn-outline">Ir al inicio</a>
                <button class="btn-primary" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="panel.js"></script>
</body>
</html>
